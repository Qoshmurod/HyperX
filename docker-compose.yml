# Lokal ishlab chiqish va bitta tuman tuguni uchun muhit.
# Ishga tushirish: cp .env.example .env && docker compose up -d

name: govmind

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GOVMIND_APP_DB_PASSWORD: ${GOVMIND_APP_DB_PASSWORD}
      GOVMIND_AUDITOR_DB_PASSWORD: ${GOVMIND_AUDITOR_DB_PASSWORD}
      GOVMIND_LOAD_SEEDS: ${GOVMIND_LOAD_SEEDS:-false}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/govmind/migrations:ro
      - ./database/seeds:/govmind/seeds:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]

  minio:
    <<: *restart
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8080:8080"]

  ollama:
    <<: *restart
    image: ollama/ollama:0.5.4
    volumes: [ollamadata:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    profiles: ["ai"]

  ai-engine:
    <<: *restart
    build: ./apps/ai-engine
    environment:
      GOVMIND_NODE_ROLE: ${GOVMIND_NODE_ROLE}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]
    # Faqat ichki tarmoq: tashqariga port ochilmaydi.
    expose: ["8000"]
    profiles: ["app"]

  api:
    <<: *restart
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      GOVMIND_NODE_ROLE: ${GOVMIND_NODE_ROLE}
      GOVMIND_NODE_ID: ${GOVMIND_NODE_ID}
      DATABASE_URL: postgresql://govmind_app:${GOVMIND_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AI_ENGINE_URL: http://ai-engine:8000
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:3001:3001"]
    profiles: ["app"]

  web:
    <<: *restart
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    profiles: ["app"]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
  ollamadata:
