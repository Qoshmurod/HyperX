# GovMind AI — bitta tugun (tuman/viloyat/markaz) uchun to'liq muhit.
#
#   cp .env.example .env            # va barcha "change-me" qiymatlarini almashtiring
#   docker compose up -d            # asosiy servislar
#   docker compose --profile ai up -d          # + lokal LLM (Ollama)
#   docker compose --profile monitoring up -d  # + Prometheus, Grafana, Alertmanager
#   docker compose --profile edge up -d        # + Nginx (TLS)
#
# Tugun profillari: deployments/{local-node,regional-node,central-cloud}

name: govmind

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  internal:
    internal: true
  edge:

services:
  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GOVMIND_APP_DB_PASSWORD: ${GOVMIND_APP_DB_PASSWORD}
      GOVMIND_AUDITOR_DB_PASSWORD: ${GOVMIND_AUDITOR_DB_PASSWORD}
      GOVMIND_LOAD_SEEDS: ${GOVMIND_LOAD_SEEDS:-false}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/govmind/migrations:ro
      - ./database/seeds:/govmind/seeds:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]

  qdrant:
    <<: [*restart, *logging]
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]
    networks: [internal]

  minio:
    <<: [*restart, *logging]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    networks: [internal]

  keycloak:
    <<: [*restart, *logging]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm", "--optimized=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GOVMIND_WEB_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      GOVMIND_WEB_BASE_URL: ${WEB_BASE_URL}
      GOVMIND_DEMO_PASSWORD: ${GOVMIND_DEMO_PASSWORD:-}
    volumes:
      - ./infrastructure/keycloak/${KEYCLOAK_REALM_DIR:-import-prod}:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal, edge]
    ports: ["127.0.0.1:8080:8080"]

  ollama:
    <<: [*restart, *logging]
    image: ollama/ollama:0.5.4
    volumes: [ollamadata:/root/.ollama]
    networks: [internal]
    profiles: ["ai"]

  ai-engine:
    <<: [*restart, *logging]
    build: ./apps/ai-engine
    environment:
      GOVMIND_NODE_ROLE: ${GOVMIND_NODE_ROLE}
      AI_ENGINE_TOKEN: ${AI_ENGINE_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL:-}
      LOCAL_CHAT_MODEL: ${LOCAL_CHAT_MODEL:-qwen2.5:7b-instruct}
      LOCAL_MODEL_MAX_CLASSIFICATION: ${LOCAL_MODEL_MAX_CLASSIFICATION:-confidential}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      CENTRAL_LLM_URL: ${CENTRAL_LLM_URL:-}
      CENTRAL_LLM_MODEL: ${CENTRAL_LLM_MODEL:-}
      CENTRAL_LLM_API_KEY: ${CENTRAL_LLM_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]
    networks: [internal]

  api:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      GOVMIND_NODE_ROLE: ${GOVMIND_NODE_ROLE}
      GOVMIND_NODE_ID: ${GOVMIND_NODE_ID}
      GOVMIND_ROOT_PATH: ${GOVMIND_ROOT_PATH}
      DATABASE_URL: postgresql://govmind_app:${GOVMIND_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUDITOR_DATABASE_URL: postgresql://govmind_auditor:${GOVMIND_AUDITOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_JWKS_URL: http://keycloak:8080/realms/govmind/protocol/openid-connect/certs
      OIDC_AUDIENCE: govmind-web
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_TOKEN: ${AI_ENGINE_TOKEN}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: govmind-documents
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      UPSTREAM_SYNC_URL: ${UPSTREAM_SYNC_URL:-}
      UPSTREAM_SYNC_TOKEN: ${UPSTREAM_SYNC_TOKEN:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      METRICS_TOKEN: ${METRICS_TOKEN}
      WEB_BASE_URL: ${WEB_BASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    networks: [internal, edge]
    ports: ["127.0.0.1:3001:3001"]

  web:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001
      WEB_BASE_URL: ${WEB_BASE_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: govmind-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on: [api]
    networks: [edge]
    ports: ["127.0.0.1:3000:3000"]

  nginx:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/govmind.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./infrastructure/nginx/tls}:/etc/nginx/tls:ro
    depends_on: [web, api, keycloak]
    networks: [edge]
    ports: ["80:80", "443:443"]
    profiles: ["edge"]

  backup:
    <<: [*logging]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache bash openssl >/dev/null && while true; do bash /scripts/backup.sh; sleep 86400; done"]
    environment:
      BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEY_FILE: /run/secrets/backup_key
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      METRICS_DIR: /metrics
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ${BACKUP_KEY_FILE:-./secrets/backup.key}:/run/secrets/backup_key:ro
      - nodemetrics:/metrics
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    profiles: ["backup"]

  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - ${METRICS_TOKEN_FILE:-./secrets/metrics_token}:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    networks: [internal, edge]
    ports: ["127.0.0.1:9090:9090"]
    profiles: ["monitoring"]

  alertmanager:
    <<: [*restart, *logging]
    image: prom/alertmanager:v0.27.0
    networks: [internal]
    profiles: ["monitoring"]

  grafana:
    <<: [*restart, *logging]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal, edge]
    ports: ["127.0.0.1:3002:3000"]
    profiles: ["monitoring"]

  postgres-exporter:
    <<: [*restart, *logging]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [internal]
    profiles: ["monitoring"]

  node-exporter:
    <<: [*restart, *logging]
    image: prom/node-exporter:v1.8.2
    command: ["--collector.textfile.directory=/metrics"]
    volumes: [nodemetrics:/metrics:ro]
    networks: [internal]
    profiles: ["monitoring"]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
  ollamadata:
  promdata:
  nodemetrics:
