[project]
name = "govmind-ai-engine"
version = "0.1.0"
description = "GovMind AI — AI servislari (gateway, analyst, RAG, forecast, Uzbek NLP)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
