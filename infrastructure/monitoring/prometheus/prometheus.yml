global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: govmind-api
    metrics_path: /api/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:3001"]
  - job_name: govmind-ai-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-engine:8000"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
