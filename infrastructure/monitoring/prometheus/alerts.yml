groups:
  - name: govmind
    rules:
      - alert: ApiDown
        expr: up{job="govmind-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "GovMind API ishlamayapti" }
      - alert: AiEngineDown
        expr: up{job="govmind-ai-engine"} == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "AI engine ishlamayapti — asosiy funksiyalar ishlaydi, AI cheklangan" }
      - alert: High5xxRate
        expr: sum(rate(govmind_api_http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(govmind_api_http_request_duration_seconds_count[5m])) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "API so'rovlarining 2% dan ortig'i xato bilan tugamoqda" }
      - alert: SlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(govmind_api_http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "API javoblarining 95-persentili 2 soniyadan oshdi" }
      - alert: SyncBacklog
        expr: govmind_sync_queue{state="pending"} > 1000
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Sinxronizatsiya navbati to'planib qolmoqda (yuqori tugun bilan aloqa yo'qmi?)" }
      - alert: SyncConflicts
        expr: govmind_sync_queue{state="conflict"} > 0
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Hal qilinmagan sinxronizatsiya konfliktlari bor" }
      - alert: WebhookFailures
        expr: govmind_delivery_queue{kind="webhook",state="failed_1h"} > 10
        labels: { severity: warning }
        annotations: { summary: "Integratsiya webhooklari yetkazilmayapti" }
      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Diskda 10% dan kam joy qoldi" }
      - alert: BackupMissing
        expr: time() - govmind_backup_last_success_timestamp_seconds > 26 * 3600
        labels: { severity: critical }
        annotations: { summary: "So'nggi 26 soatda muvaffaqiyatli zaxira nusxa olinmagan" }
