# GovMind AI — teskari proksi. TLS sertifikatlari /etc/nginx/tls ga joylanadi.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server_tokens off;

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; form-action 'self' https://$host" always;

    client_max_body_size 30m;
    limit_conn conn 50;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Keycloak (/realms, /resources) — kirish sahifasi
    location ~ ^/(realms|resources)/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://keycloak:8080;
    }
    # Keycloak admin konsoli faqat ichki tarmoqdan
    location ^~ /admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://keycloak:8080;
    }

    # Tashqi tizimlar uchun API (X-Api-Key) va tugunlararo sinxronizatsiya
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://api:3001;
    }
    # Metrika va Swagger tashqariga chiqarilmaydi
    location = /api/v1/metrics { deny all; }
    location ^~ /api/docs { deny all; }

    location / {
        proxy_read_timeout 120s;
        proxy_pass http://web:3000;
    }
}
